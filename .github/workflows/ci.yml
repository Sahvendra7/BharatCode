name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run eval:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Client bundle must not contain the API key variable or key-like strings
        run: |
          if grep -rE "bc_live_|bc_test_e2e" .next-e2e/static; then echo "key-like string in client bundle"; exit 1; fi
